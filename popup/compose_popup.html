<!DOCTYPE html>
<!-- ==========================================================================
     Magic Mail - Compose Action Popup
     Provides Schedule Send and Master-Detail Quick Templates in compose windows.
     Developer: Al Shimbil Khan <shimbilmax@gmail.com> | +8801516711976
     ========================================================================== -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Mail – Compose Options</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="compose_popup.css">
</head>

<body data-theme="light">
  <div class="magicmail-app">
    <header class="app-header">
      <div class="brand-wrapper">
        <img src="../icons/icon-48.png" alt="Magic Mail" class="brand-icon">
        <div class="brand-titles">
          <div class="brand-name">Magic <span>Mail</span></div>
          <div class="brand-tagline">Compose Tools</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-icon" id="openSettingsBtn" title="Open Settings">
          <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs-nav" id="tabsContainer" role="tablist">
      <button type="button" class="tab-btn active" data-tab="templateTab" role="tab">
        <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <span>Templates</span>
      </button>
      <button type="button" class="tab-btn" data-tab="scheduleTab" role="tab">
        <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <span>Schedule</span>
      </button>
    </nav>

    <main class="app-body compose-body" id="contentArea">
      <!-- Templates Tab (Master-Detail Workspace) -->
      <section id="templateTab" class="tab-pane active" role="tabpanel">
        <div id="composeAlert" class="alert hidden" role="alert"></div>

        <div class="templates-topbar">
          <div class="template-search-wrap">
            <svg class="icon-svg icon-svg-sm template-search-icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="templateSearchInput" class="template-search-input"
              placeholder="Search templates...">
          </div>
          <select id="templateCategoryFilters" class="template-filter-select"
            aria-label="Filter templates by category">
            <option value="All">All Categories</option>
          </select>
          <button type="button" class="btn-primary btn-sm" id="toggleTemplateEditorBtn" title="Create a new template">
            <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span>New</span>
          </button>
        </div>

        <div class="templates-workspace">
          <aside class="templates-sidebar">
            <div class="templates-sidebar-header">
              <span>Templates</span>
              <div class="templates-header-right">
                <button type="button" class="link-btn hidden" id="restoreDefaultTemplatesBtn"
                  title="Restore built-in templates">Restore</button>
                <span id="templatesCountBadge" class="badge-subtle">0</span>
              </div>
            </div>
            <div id="templatesList" class="templates-nav-list"></div>
          </aside>

          <div class="templates-detail-pane">
            <div id="templateDetailView" class="template-detail-view hidden">
              <div class="template-detail-header">
                <div class="template-detail-titles">
                  <h3 id="detailTemplateTitle" class="template-detail-title">Subject</h3>
                  <span id="detailTemplateCategory" class="template-item-category">General</span>
                </div>
                <div class="template-detail-manage">
                  <button type="button" class="btn-icon-sm" id="detailEditTemplateBtn" title="Edit template">
                    <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                  </button>
                  <button type="button" class="btn-icon-sm btn-icon-danger" id="detailDeleteTemplateBtn"
                    title="Delete template">
                    <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
                      <polyline points="3 6 5 6 21 6" />
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                  </button>
                </div>
              </div>

              <div id="detailDeleteConfirmBar" class="template-delete-confirm hidden">
                <span>Delete this template?</span>
                <div class="template-delete-confirm-btns">
                  <button type="button" class="btn-ghost btn-sm" id="detailCancelDeleteBtn">Cancel</button>
                  <button type="button" class="btn-danger btn-sm" id="detailConfirmDeleteBtn">Delete</button>
                </div>
              </div>

              <div id="detailTemplateBody" class="template-detail-body"></div>

              <div class="template-detail-footer">
                <button type="button" class="btn-primary btn-sm" id="detailPrimaryUseBtn">
                  <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
                    <path d="M12 3v12" />
                    <path d="m7 10 5 5 5-5" />
                    <path d="M4 21h16" />
                  </svg>
                  <span id="detailPrimaryUseLabel">Insert in Current Mail</span>
                </button>
              </div>
            </div>

            <div id="templateEditorCard" class="template-editor-pane hidden">
              <div class="template-editor-header">
                <span id="templateEditorHeading" class="template-editor-title">New Template</span>
              </div>
              <input type="hidden" id="editingTemplateId" value="">
              <div class="template-editor-row">
                <input type="text" id="newTemplateTitle" placeholder="Template Title..." aria-label="Template Title">
                <select id="newTemplateCategory" aria-label="Template Category">
                  <option value="General">General</option>
                  <option value="Business">Business</option>
                  <option value="Updates">Updates</option>
                  <option value="Follow-Up">Follow-Up</option>
                  <option value="Outreach">Outreach</option>
                  <option value="Support">Support</option>
                  <option value="Personal">Personal</option>
                </select>
              </div>
              <textarea id="newTemplateBody" class="template-editor-textarea"
                placeholder="Write or paste your email template here..."></textarea>
              <div class="template-editor-actions">
                <button type="button" class="btn-ghost btn-sm" id="cancelTemplateEditBtn">Cancel</button>
                <button type="button" class="btn-primary btn-sm" id="saveNewTemplateBtn">
                  <span id="saveTemplateBtnLabel">Save Template</span>
                </button>
              </div>
            </div>

            <div id="templateEmptyView" class="template-empty-pane hidden">
              <svg class="icon-svg" style="width: 28px; height: 28px; color: var(--text-muted);" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              <div id="templateEmptyMessage" class="template-empty-msg">Select a template to preview and use it.</div>
              <button type="button" class="btn-secondary btn-sm" id="emptyCreateTemplateBtn">+ Create New Template</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Schedule Tab -->
      <section id="scheduleTab" class="tab-pane" role="tabpanel">
        <div class="card" id="scheduleBody">
          <div class="card-title">
            <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span>Schedule Send</span>
          </div>
          <div class="field">
            <label for="scheduleTime">Delivery Time</label>
            <input type="datetime-local" id="scheduleTime">
          </div>
          <div class="field">
            <label for="scheduleRecurrence">Repeat</label>
            <select id="scheduleRecurrence">
              <option value="none">Does not repeat (One-time)</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <button type="button" id="scheduleBtn" class="btn-primary full-width-btn">
            <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
            <span>Schedule Delivery</span>
          </button>
          <div id="status" class="alert hidden" style="margin-top: 10px;" role="status"></div>
        </div>
      </section>
    </main>

    <div id="composeFeatureFootnote" class="compose-footnote hidden">
      <span id="composeFootnoteText"></span>
      <button type="button" class="compose-footnote-link" id="composeFootnoteSettingsBtn">Settings</button>
    </div>
  </div>

  <script src="../services/storage-service.js"></script>
  <script src="../services/ui-helpers.js"></script>
  <script src="../services/template-manager.js"></script>
  <script src="compose_popup.js"></script>
</body>

</html>
