<!DOCTYPE html>
<!-- ==========================================================================
     Magic Mail - Message Display Action Popup
     Quick actions to reply or reply all with original message attachments.
     Developer: Al Shimbil Khan <shimbilmax@gmail.com> | +8801516711976
     ========================================================================== -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Mail – Reply with Attachments</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="message_action.css">
</head>

<body data-theme="light">
  <div class="magicmail-app">
    <header class="app-header">
      <div class="brand-wrapper">
        <img src="../icons/icon-48.png" alt="Magic Mail" class="brand-icon">
        <div class="brand-titles">
          <div class="brand-name">Magic <span>Mail</span></div>
          <div class="brand-tagline">Message Quick Actions</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-icon" id="openSettingsBtn" title="Open Settings">
          <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-body">
      <div id="actionAlert" class="alert alert-danger hidden" role="alert"></div>

      <div class="action-list">
        <button type="button" id="replyBtn" class="action-card-btn">
          <span class="action-icon-box">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <polyline points="9 17 4 12 9 7" />
              <path d="M20 18v-2a4 4 0 0 0-4-4H4" />
            </svg>
          </span>
          <span class="action-text">
            <span class="action-title">Reply with Attachments</span>
            <span class="action-subtitle">Reply to sender and include files</span>
          </span>
        </button>

        <button type="button" id="replyAllBtn" class="action-card-btn">
          <span class="action-icon-box">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <polyline points="7 17 2 12 7 7" />
              <polyline points="12 17 7 12 12 7" />
              <path d="M22 18v-2a4 4 0 0 0-4-4H7" />
            </svg>
          </span>
          <span class="action-text">
            <span class="action-title">Reply All with Attachments</span>
            <span class="action-subtitle">Reply to all recipients with files</span>
          </span>
        </button>
      </div>
    </main>
  </div>

  <script src="../services/storage-service.js"></script>
  <script src="../services/ui-helpers.js"></script>
  <script src="message_action.js"></script>
</body>

</html>
